name: Self Decay Badge

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Build viewer package
        run: wasm-pack build crates/grave-wasm --target web --out-dir viewer/pkg
      - name: Stage Pages site
        run: |
          site_dir="$RUNNER_TEMP/grave-site"
          mkdir -p "$site_dir/badge"
          cp -R viewer/. "$site_dir/"
          cargo run --quiet -p grave-cli --example self_decay_badge -- \
            .github/sample.grave \
            "$site_dir/badge/self-decay.json"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/grave-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
