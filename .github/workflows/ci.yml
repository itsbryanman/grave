name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --exclude grave-wasm --all-targets -- -D warnings
      - name: Test
        run: cargo test

  wasm:
    name: Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Check grave-wasm
        run: cargo check -p grave-wasm --target wasm32-unknown-unknown
      - name: Run wasm tests
        run: wasm-pack test --node crates/grave-wasm
      - name: Build viewer package
        run: wasm-pack build crates/grave-wasm --target web --out-dir "$RUNNER_TEMP/viewer-pkg"

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build image
        run: docker build --tag grave-ci .
