[workspace]
members = [
    "crates/grave-core",
    "crates/grave-cli",
    "crates/grave-wasm",
]
default-members = [
    "crates/grave-core",
    "crates/grave-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/itsbryanman/grave"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.89"
chrono = { version = "0.4.38", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.18", features = ["derive"] }
comfy-table = "7.1.1"
crc32fast = "1.4.2"
dialoguer = "0.11.0"
image = { version = "0.24.9", default-features = false, features = ["gif", "jpeg", "png"] }
rand = "0.8.5"
rand_chacha = "0.3.1"
rand_core = "0.6.4"
ruzstd = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
sha2 = "0.10.9"
tempfile = "3.12.0"
thiserror = "1.0.64"
wasm-bindgen = "0.2.117"
wasm-bindgen-test = "0.3.76"
zstd = "0.13.3"
